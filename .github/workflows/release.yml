name: Release

# v1.0.0 같은 태그를 올리면 Windows 설치 파일과 macOS dmg를 빌드해 GitHub Release로 올립니다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win
            # latest.yml과 blockmap은 앱의 자동 업데이트가 새 버전을 찾고 받는 데 씁니다.
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: macos-latest
            target: --mac
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      # 코드 서명 인증서가 없으므로 서명 없이 빌드합니다.
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Hamboogie $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
