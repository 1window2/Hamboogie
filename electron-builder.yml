appId: io.github.1window2.hamboogie
productName: Hamboogie
directories:
  output: release
files:
  - out/**
  - "!out/**/*.map"
  - resources/**
  - package.json
# 다른 프로그램이 앱 실행 파일을 Node처럼 띄우거나 디버거를 붙여, OS 보안 저장소에 넣어 둔 비밀번호를 꺼내 가지 못하게 합니다.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  # 앱 파일(app.asar)을 몰래 바꿔 비밀 정보를 꺼내는 것을 막기 위해, 실행할 때 빌드 때의 해시와 비교합니다.
  enableEmbeddedAsarIntegrityValidation: true
  # 서명하지 않은 macOS 빌드는 퓨즈를 바꾸면 기존 서명이 깨져 Apple Silicon에서 실행되지 않으므로 임시 서명을 다시 합니다.
  resetAdHocDarwinSignature: true
win:
  target: nsis
  # 16·32px 프레임은 작은 크기용으로 따로 그린 그림을 넣은 아이콘입니다(1024 아이콘을 줄이면 말풍선 꼬리가 사라짐).
  icon: build/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.utilities
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  # 볼륨 아이콘과 배경은 dmg 안에 숨김 파일(.VolumeIcon.icns, .background.tiff)로 들어갑니다. Finder에서 숨김 파일 보기를 켜면
  # 위치를 정하지 않은 이 파일들이 앱 아이콘 위에 보이므로, 같은 파일을 같은 이름으로 넣으며 창 바로 아래에 둡니다.
  # 배경은 기본 배경(540x380)의 화살표를 위로 옮기고 높이를 줄여, Finder의 탭·경로 막대가 보여도 아이콘이 잘리지 않게 했습니다.
  icon: build/volume.icns
  background: build/background.tiff
  contents:
    - {x: 130, y: 80, type: file}
    - {x: 410, y: 80, type: link, path: /Applications}
    - {x: 130, y: 330, type: file, path: build/background.tiff, name: .background.tiff}
    - {x: 410, y: 330, type: file, path: build/volume.icns, name: .VolumeIcon.icns}
publish:
  provider: github
  owner: 1window2
  repo: Hamboogie
